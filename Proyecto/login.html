<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NutriVida - Iniciar Sesión</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <img src="img/logo-nutrivida.png" alt="Logo NutriVida" class="logo">

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="login.html" class="activo">Iniciar Sesión</a></li>
                <li><a href="registro.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>


    <main>

        <form id="login" class="login-formulario" novalidate>

            <h1>Iniciar sesión</h1>

            <p class="login-descripcion">
                Ingresa tus datos para acceder a tu cuenta NutriVida.
            </p>


            <div class="campo-login">

                <label for="emailSes">Correo electrónico</label>

                <input
                    type="text"
                    id="emailSes"
                    placeholder="ejemplo@gmail.com"
                >

            </div>


            <div class="campo-login">

                <label for="contraSes">Contraseña</label>

                <input
                    type="password"
                    id="contraSes"
                    placeholder="Ingresa tu contraseña"
                >

            </div>


            <button type="submit" class="boton-login">
                Iniciar sesión
            </button>


            <div class="login-enlaces">

                <p>
                    ¿No tienes una cuenta?
                    <a href="registro.html">Regístrate aquí</a>
                </p>

                <a href="index.html">
                    ← Volver al inicio
                </a>

            </div>

        </form>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
